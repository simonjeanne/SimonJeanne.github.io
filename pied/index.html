<html>

<head>
	<meta name="robots" content="noindex, nofollow" />

	<title >Mes Pieds</title>  
	
	<style> 
		body{ cursor:url(media/Human_male_foot.png),auto; } 
	</style>
	
</head>





<body id="page" background="media/table_.jpg" style="background-size:cover;">


	<audio id="son_livre" src="media/ouvrir_livre.mp3" preload="yes"></audio>
	<audio id="son_page" src="media/tourner_page.mp3" preload="yes"></audio>
	<audio id="son_photo" src="media/prendre_photo.mp3" preload="yes"></audio>
	<audio id="son_photo_2" src="media/poser_photo.mp3" preload="yes"></audio>
	<audio id="son_piano" src="media/gymnopedie_n1.mp3" preload="yes"></audio>
    <audio id="son_scratch" src="media/scratch_.mp3" preload="yes"></audio>
	



	<table width="100%" align="center" height="250" id="table_top" border="0">
		<tr>
			<td>
			</td>
		</tr>	
	</table> 
	
	<table width="1120" align="center" height="548" id="table_livre" border="0" background="media/livre_ferme.png";  style=" background-position:center; background-repeat: no-repeat; position:relative; z-index:0;">
		<tr>
			<td id="haut_livre">
			<img id='page_droite' width="0" src="media/img_small/4_portugal_2025.png" style="position:absolute; top:50px; right:200px; z-index:0;">
			<img id='page_gauche' width="0" src="media/img_small/4_portugal_2025.png" style="position:absolute; top:50px; left:200px; z-index:0;">
			</td>
		</tr>
		<tr>
			<td>
			<img id='img_encrier' width="300" src="media/encrier.png" style="position:absolute; bottom:50px; right:-280px; z-index:5;">
			<img id='img_gramophone' width="350" src="media/gramophone.png" style="position:absolute; top:-350px; right:-300px; z-index:4;">
			<a href="https://simonjeanne.github.io/"> <img id='img_C64' width="500" src="media/C64.png" style="position:absolute; top:-300px; left:-400px; z-index:5;"> </a>
			<img id='img_avant' width="0" src="none.png" style="position:absolute; top:-200px; left:400px; z-index:10;">
			<img id='img_gauche' alt="Gauche" width="0" src="media/fleche_gauche.png" style="position:absolute; bottom:50px; left:80px; z-index:0;">
			<img id='img_droite' alt="Droite" width="0" src="media/fleche_droite.png" style="position:absolute; bottom:50px; right:80px; z-index:0;">
			</td>
		</tr>
	</table>






	<script>

		<!--page.addEventListener('mousemove',  () => { explode.play(); } );
		
		const droite = document.getElementById('img_droite');
		const gauche = document.getElementById('img_gauche');
		const page_droite = document.getElementById('page_droite');
		const page_gauche = document.getElementById('page_gauche');
		const img_avant = document.getElementById('img_avant');
		const table_livre = document.getElementById('table_livre');
		const haut_livre = document.getElementById('haut_livre');
		const gramophone = document.getElementById('img_gramophone');
		const C64 = document.getElementById('img_C64');
		
		const liste_photo = [ "4_portugal_2025.png" , "3_yrisson.png" , "3_donostia_2024_.png" , "2_rhune_2024_.png" , "2_essaouira_2023_.png" ,
		"1_casablanca_2023_.png" , "1_atlas_2023_.png" 
		];
		const width_photo = [963,499,516,470,830,539,514];
		const nb_photo = liste_photo.length;
		const nb_page = liste_photo.length / 2 ;

		
		let bool_img_avant = 0;		
		let index_page = 0;
		let largeur = 0;
		


<!-- ouvrir le livre -->
		haut_livre.addEventListener('click', () => {  son_livre.play();
													  table_livre.style.backgroundImage="url('media/livre.png')"; 
													  img_gauche.width="90"; img_droite.width="90"; 
													  page_droite.width="300"; page_gauche.width="300"; page_gauche.src="media/img_small/"+liste_photo[0]; page_droite.src="media/img_small/"+liste_photo[1];
													  for(let i=0;i<nb_photo;i++) { img_avant.src="media/img_small/"+liste_photo[i]; }
													  for(let i=0;i<nb_photo;i++) { img_avant.src="media/img_big/"+liste_photo[i]; }
													} 
													,{ once: true} 
									);
		
<!-- flêche (tourner les pages) -->
		gauche.addEventListener('mouseenter',  () => { gauche.src="media/fleche_gauche_a.png"; } );
		gauche.addEventListener('mouseleave',  () => { gauche.src="media/fleche_gauche.png"; } );
		droite.addEventListener('mouseenter',  () => { droite.src="media/fleche_droite_a.png"; } );
		droite.addEventListener('mouseleave',  () => { droite.src="media/fleche_droite.png"; } );
		
		gauche.addEventListener('click', () => { if(index_page>0 && bool_img_avant==0 ){ index_page = index_page-1; tourner_page(); } } );
		droite.addEventListener('click', () => { if(index_page<nb_page-1  && bool_img_avant==0 ){ index_page = index_page+1; tourner_page(); } } );

<!-- zoom et dezoom
		page_droite.addEventListener('click', () => { if( bool_img_avant == 0 ) {  zoom_droite(); } } );
		page_gauche.addEventListener('click', () => { if( bool_img_avant == 0 ) {  zoom_gauche(); } } );
		page.addEventListener('click', () => { if( bool_img_avant == 1 ) { dezoom(); } } );
		
<!-- gramophone
		let bool_musique = 0;
		gramophone.addEventListener('click',() => { son_scratch.play(); if(bool_musique==0) { setTimeout( () => { son_piano.play(); bool_musique=1; },700); } else { son_piano.pause(); bool_musique=0; } } );
		gramophone.addEventListener('mouseenter',() => { gramophone.style.right=-305; gramophone.style.top=-355;} );
		gramophone.addEventListener('mouseleave',() => { gramophone.style.right=-300; gramophone.style.top=-350;} );
		
<!-- C64
		C64.addEventListener('mouseenter',() => { C64.style.left=-405; C64.style.top=-305;} );
		C64.addEventListener('mouseleave',() => { C64.style.left=-400; C64.style.top=-300;} );

		function tourner_page()
		{ son_page.play();
		  page_gauche.src="media/img_small/"+liste_photo[index_page*2];
			  if( index_page*2+1 == nb_photo ) { page_droite.width="0"; } 
			  else { page_droite.width="300"; page_droite.src="media/img_small/"+liste_photo[index_page*2+1]; }
		}
		
		function zoom_gauche()
		{ son_photo.play();
		  img_avant.src="media/img_big/"+liste_photo[index_page*2];
		  img_avant.width=width_photo[index_page*2];
		  img_avant.style.left=(1120-width_photo[index_page*2])/2 ;
		  page_gauche.width="0";
		  setTimeout( () => { bool_img_avant=1; } , 100 );
		}

		function zoom_droite()
		{ son_photo.play();
		  img_avant.src="media/img_big/"+liste_photo[index_page*2+1]; 
		  img_avant.width=width_photo[index_page*2+1];
		  img_avant.style.left=(1120-width_photo[index_page*2+1])/2 ;
		  page_droite.width="0";
		  setTimeout( () => { bool_img_avant=1; } , 100 );
		}
		
		function dezoom()
		{ son_photo_2.play();
		  img_avant.src="none.png"; img_avant.width="0";
		  setTimeout( () => { bool_img_avant=0; } , 100 );
		  page_gauche.width="300";  page_droite.width="300";  if( index_page*2+1 == nb_photo ) { page_droite.width="0"; } 
		}
		

	
	</script>


</body>


</html>
